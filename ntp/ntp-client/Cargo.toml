[package]
name = "ntp-client"
version = "0.1.0"
edition = "2021"
description = "Configurable NTP client in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
anyhow = "1.0"
serde_json = "1.0"
