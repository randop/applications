# Example config for ntp-client.
# Path: ./ntp-client.toml  (or pass --config <path>, or set NTP_CLIENT_CONFIG)
# Precedence: CLI flags > env vars > this file > built-in defaults.

# Standard NTP uses port 123. The local test server uses 1123.
server = "127.0.0.1"
port = 1123

# Seconds per attempt (float allowed).
timeout_secs = 5.0

# Extra retries after the first attempt.
retries = 2

# 3 or 4
ntp_version = 4

# "text" or "json"
format = "text"

# Set CLOCK_REALTIME to the NTP-corrected time (needs root / CAP_SYS_TIME).
set_system_time = false

# Also write system time to the hardware clock via `hwclock --systohc`.
# Implies set_system_time = true.
sync_hwclock = false

# Show what would be set without changing any clock.
dry_run = false

# Safety guard: refuse to step if |offset| exceeds this (seconds). 0 = no limit.
max_offset_secs = 0.0
