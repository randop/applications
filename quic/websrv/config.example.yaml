# Every setting is read from this YAML file. There is no .env loader or env override.
# Relative paths are resolved against the directory containing config.yaml.
listen: "0.0.0.0:8443" # UDP/QUIC and HTTPS (HTTP/2 or HTTP/1.1 via ALPN) share the port number; cleartext HTTP/1.1 uses port 8080.
tcp_http1_enabled: true
http2_enabled: true
http1_cleartext_enabled: true
http1_cleartext_listen: "0.0.0.0:8080"
tls_cert: "certs/fullchain.pem"
tls_key: "certs/privkey.pem"
max_request_body_bytes: 1048576
max_static_file_bytes: 16777216
log_filter: "info,websrv=debug"

# Requests on HTTP/3, HTTP/2, and both HTTP/1.1 listeners are routed by :authority / Host. Exact names are checked before wildcards.
default_host: "example.test"
virtual_hosts:
  - host: "example.test"
    aliases: ["www.example.test"]
    static:
      root: "public"
      index: "index.html"
      spa_fallback: false
      cache_control: "public, max-age=60"

  - host: "*.tenant.example.test"
    static:
      root: "sites"
      index: "index.html"
      spa_fallback: true
      cache_control: "public, max-age=300"

  - host: "api.example.test"
    controller: "public_api"

controllers:
  public_api:
    routes:
      - method: "GET"
        path: "/healthz"
        handler: "health"
      - method: "GET"
        path: "/status"
        handler: "status"
      - method: "POST"
        path: "/echo"
        handler: "echo"
      - method: "GET"
        path: "/v1/items"
        handler: "items"
      - method: "POST"
        path: "/v1/items"
        handler: "items"
      - method: "GET"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "HEAD"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "PUT"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "PATCH"
        path: "/v1/items/{id}"
        handler: "items"
      - method: "DELETE"
        path: "/v1/items/{id}"
        handler: "items"
