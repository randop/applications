[package]
name = "quic-graphql-sqlite"
version = "0.1.1"
edition = "2024"

[dependencies]
salvo = { version = "0.74", features = ["quinn", "rustls", "affix-state", "logging"] }
async-graphql = "7.2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
