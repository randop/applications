spring.application.name=starter

spring.threads.virtual.enabled=true

# H2 Console Access
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DataSource Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Disable Open Session in View pattern to clear warning and protect connection pools
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.core=WARN

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
#logging.level.org.springframework.data.redis=DEBUG
#logging.level.io.lettuce.core=DEBUG
#logging.level.redis.clients.jedis=DEBUG
#logging.level.org.springframework.data.redis=TRACE
#logging.level.io.lettuce.core=TRACE

# Mongodb Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/springboot
spring.data.mongodb.auto-index-creation=true
