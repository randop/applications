[package]
name = "ats"
version = "0.1.0"
edition = "2021"
description = "Applicant Tracking System (ATS) REST API built with Axum"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "uuid", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-deflate", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
validator = { version = "0.18", features = ["derive"] }
dotenvy = "0.15"
anyhow = "1"
async-graphql = { version = "7", features = ["uuid", "chrono"] }
async-graphql-axum = "7"
socket2 = "0.6"

[profile.release]
lto = true
codegen-units = 1